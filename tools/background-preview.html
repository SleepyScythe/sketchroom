<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library background</title>
<!-- A preview for choosing the library page's background art. Not linked from the site. Uses the real styles.css and
     js/background.js, so what you see here is what the library will look like. Serve the folder (tools/serve.ps1)
     and open http://localhost:8000/tools/background-preview.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../styles.css?v=13">
<style>
  .libbg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .libshade { position: fixed; inset: 0; background: var(--bg); pointer-events: none; }
  .home { position: relative; }
  .hthumb canvas { width: 100%; height: 100%; display: block; }
  .bgpanel { position: fixed; right: 16px; bottom: 16px; z-index: 5; width: min(320px, calc(100vw - 32px)); max-height: min(72vh, 660px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px var(--shadow); }
  .bgphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 16px; }
  .bgphead strong { font-family: var(--font-display); font-size: 16px; }
  .bgpbody { overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .bgpanel.folded .bgpbody { display: none; }
  .bgpanel .field { flex: none; }
  .bglabel { display: flex; justify-content: space-between; gap: 8px; }
  .bglabel .val { color: var(--fg); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .bgpanel { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 48vh; } }
  .bgpanel input[type="range"] { width: 100%; padding: 0; border: 0; background: none; accent-color: var(--accent); }
  .bgchips { display: flex; flex-wrap: wrap; gap: 7px; }
  .bgchip { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; opacity: 0.3; }
  .bgchip[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--fg); }
  .bgrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bgrow input[type="number"] { width: 96px; flex: none; }
  .bgseg { display: inline-flex; gap: 3px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; }
  .bgseg button { font: inherit; color: var(--mute); background: none; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .bgseg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .copied { color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
<canvas class="libbg" id="bgCanvas" aria-hidden="true"></canvas>
<div class="libshade" id="bgShade"></div>

<div class="home">
  <header class="top">
    <div class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 46c9-15 16-24 23-22s-2 15 5 17 9-9 16-18"/></svg><span class="logo">Sketchroom</span></div>
    <div class="top-actions"><button class="btn account">@sleepy</button></div>
  </header>
  <main class="homebody">
    <section class="library">
      <div class="homebar">
        <nav class="crumbs" aria-label="Where you are"><span aria-current="page">Library</span></nav>
        <div class="homebtns"><button class="btn">Friends</button><button class="btn primary">Create new</button></div>
      </div>
      <div class="hgrid" id="mockGrid"></div>
    </section>
  </main>
</div>

<aside class="bgpanel" id="bgPanel" aria-label="Edit the background">
  <div class="bgphead"><strong>Library background</strong><button class="btn sm" id="bgFold" aria-expanded="true">Hide</button></div>
  <div class="bgpbody">
    <label class="field">Style<select id="bgStyle"></select></label>
    <div class="field">Colors<div class="bgchips" id="bgColors"></div></div>
    <label class="field"><span class="bglabel">Amount<span class="val" id="amountVal"></span></span><input type="range" id="amount" min="0" max="100"></label>
    <label class="field"><span class="bglabel">Size<span class="val" id="sizeVal"></span></span><input type="range" id="size" min="0" max="100"></label>
    <label class="field"><span class="bglabel">Strength<span class="val" id="strengthVal"></span></span><input type="range" id="strength" min="0" max="100"></label>
    <label class="field"><span class="bglabel">Softness (blur)<span class="val" id="softnessVal"></span></span><input type="range" id="softness" min="0" max="100"></label>
    <label class="field"><span class="bglabel">Fade it back<span class="val" id="shadeVal"></span></span><input type="range" id="shade" min="0" max="90"></label>
    <label class="field">Where<select id="bgPlace"></select></label>
    <div class="field">Variation
      <div class="bgrow"><input type="number" id="bgSeed" min="1" max="999999" aria-label="Variation number"><button type="button" class="btn sm" id="bgShuffle">Shuffle</button></div>
    </div>
    <div class="field">See it in
      <div class="bgseg" id="bgTheme"><button type="button" data-t="dark">Dark mode</button><button type="button" data-t="light">Light mode</button></div>
    </div>
    <div class="bgrow"><button type="button" class="btn sm" id="bgReset">Back to the live one</button><button type="button" class="btn sm" id="bgCopy">Copy settings</button><span class="copied" id="bgCopied" aria-live="polite"></span></div>
    <p class="hint">The library uses BG_LIBRARY in js/background.js. Happy with a new one? Tell Claude "use this background" and it replaces it. Your settings stay in this browser.</p>
  </div>
</aside>

<script src="../js/background.js?v=13"></script>
<script>
(function () {
  'use strict';
  var KEY = 'sketchroom.bgPreview', $ = function (s) { return document.querySelector(s); };
  var s = Object.assign({}, BG_LIBRARY); // starts from the one on the site
  try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved === 'object') s = Object.assign(s, saved); } catch (e) { /* storage unavailable */ }
  window.bgSettings = s; // read by Claude when you say "use this background"

  /* ---------- the pretend library ---------- */
  var ICON = {
    project: ['M3 8h18v12H3z', 'M8 8V5h8v3', 'M3 13h18'],
    folder: ['M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z'],
    more: ['M5 11.2a.8.8 0 1 0 0 1.6.8.8 0 1 0 0-1.6Z', 'M12 11.2a.8.8 0 1 0 0 1.6.8.8 0 1 0 0-1.6Z', 'M19 11.2a.8.8 0 1 0 0 1.6.8.8 0 1 0 0-1.6Z']
  };
  var svg = function (n, size) {
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n].map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</svg>';
  };
  var CARDS = [
    { type: 'project', name: 'Tattoo flash', sub: 'Project, 3 items' },
    { type: 'folder', name: 'Sketchbook', sub: 'Folder, 12 items' },
    { type: 'image', name: 'Koi sleeve', sub: '2048 × 2048', art: { style: 'flow', colors: ['#1d2a33', '#e5604d'], amount: 30, size: 35, strength: 85, place: 'all', seed: 3 } },
    { type: 'image', name: 'Lettering study', sub: '1600 × 1200', art: { style: 'scribbles', colors: ['#1d2a33'], amount: 40, size: 30, strength: 90, place: 'all', seed: 11 } },
    { type: 'image', name: 'Pixel sword', sub: 'Pixel art, 8 × 8 tiles of 16 px', pixel: true, art: { style: 'pixels', colors: ['#5b6ad0', '#d9a21b', '#e5604d'], amount: 45, size: 25, strength: 95, place: 'all', seed: 5 } },
    { type: 'image', name: 'Ink splatter test', sub: '1080 × 1920', art: { style: 'splatter', colors: ['#1d2a33', '#0f8f80'], amount: 25, size: 25, strength: 90, place: 'all', seed: 21 } }
  ];
  var grid = $('#mockGrid');
  CARDS.forEach(function (c) {
    var d = document.createElement('div'); d.className = 'hcard ' + c.type;
    var th = document.createElement('div'); th.className = 'hthumb' + (c.pixel ? ' checker' : '');
    if (c.art) { var cv = document.createElement('canvas'); if (c.pixel) cv.style.imageRendering = 'pixelated'; th.appendChild(cv); c.canvas = cv; }
    else th.innerHTML = svg(c.type, 44);
    var meta = document.createElement('div'); meta.className = 'hmeta';
    var nm = document.createElement('span'); nm.className = 'hname'; nm.textContent = c.name;
    var sub = document.createElement('span'); sub.className = 'hsub'; sub.textContent = c.sub;
    meta.append(nm, sub);
    var more = document.createElement('span'); more.className = 'ibtn sm hmore'; more.innerHTML = svg('more', 18);
    d.append(th, meta, more); grid.appendChild(d);
  });
  var drawThumbs = function () { CARDS.forEach(function (c) { if (c.canvas) paintBackground(c.canvas, c.art); }); };

  /* ---------- the controls ---------- */
  BG_STYLES.forEach(function (o) { $('#bgStyle').add(new Option(o[1], o[0])); });
  BG_PLACES.forEach(function (o) { $('#bgPlace').add(new Option(o[1], o[0])); });
  BG_COLORS.forEach(function (o) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'bgchip'; b.style.background = o[1]; b.dataset.c = o[1];
    b.title = o[0]; b.setAttribute('aria-label', o[0]);
    b.addEventListener('click', function () {
      var on = s.colors.indexOf(o[1]) >= 0;
      if (on && s.colors.length === 1) return; // keep at least one color
      s.colors = on ? s.colors.filter(function (c) { return c !== o[1]; }) : s.colors.concat(o[1]);
      changed();
    });
    $('#bgColors').appendChild(b);
  });
  var SLIDERS = ['amount', 'size', 'strength', 'softness', 'shade'];
  SLIDERS.forEach(function (id) { $('#' + id).addEventListener('input', function (e) { s[id] = Number(e.target.value); changed(); }); });
  $('#bgStyle').addEventListener('change', function (e) { s.style = e.target.value; changed(); });
  $('#bgPlace').addEventListener('change', function (e) { s.place = e.target.value; changed(); });
  $('#bgSeed').addEventListener('change', function (e) { s.seed = Math.round(bgClamp(e.target.value, 1, 999999)); changed(); });
  $('#bgShuffle').addEventListener('click', function () { s.seed = 1 + Math.floor(Math.random() * 99999); changed(); });
  $('#bgReset').addEventListener('click', function () { s = Object.assign({}, BG_LIBRARY); window.bgSettings = s; changed(); });
  $('#bgCopy').addEventListener('click', function () {
    var text = JSON.stringify(s);
    var done = function () { $('#bgCopied').textContent = 'Copied'; setTimeout(function () { $('#bgCopied').textContent = ''; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy these settings:', text); });
    else window.prompt('Copy these settings:', text);
  });
  $('#bgFold').addEventListener('click', function () {
    var p = $('#bgPanel'), folded = p.classList.toggle('folded');
    $('#bgFold').textContent = folded ? 'Edit' : 'Hide'; $('#bgFold').setAttribute('aria-expanded', String(!folded));
  });
  var theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  var setTheme = function (t) {
    theme = t; document.documentElement.setAttribute('data-theme', t);
    Array.prototype.forEach.call($('#bgTheme').children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.t === t)); });
  };
  $('#bgTheme').addEventListener('click', function (e) { var b = e.target.closest('button[data-t]'); if (b) setTheme(b.dataset.t); });
  setTheme(theme);

  function sync() {
    $('#bgStyle').value = s.style; $('#bgPlace').value = s.place; $('#bgSeed').value = s.seed;
    SLIDERS.forEach(function (id) { $('#' + id).value = s[id]; $('#' + id + 'Val').textContent = s[id]; });
    Array.prototype.forEach.call($('#bgColors').children, function (b) { b.setAttribute('aria-pressed', String(s.colors.indexOf(b.dataset.c) >= 0)); });
  }
  var queued = false;
  function draw() {
    queued = false;
    paintBackground($('#bgCanvas'), s);
    $('#bgShade').style.opacity = String(bgClamp(s.shade, 0, 90) / 100);
  }
  function changed() {
    window.bgSettings = s; sync();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
    if (!queued) { queued = true; requestAnimationFrame(draw); }
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { draw(); drawThumbs(); }, 150); });
  sync(); draw(); drawThumbs();
})();
</script>
</body>
</html>
